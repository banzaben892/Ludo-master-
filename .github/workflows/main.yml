name: Build FlappyCoin APK with Deep Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant permission
        run: chmod +x android/gradlew

      - name: 🔍 Pre-build source analysis
        id: source_analysis
        run: |
          echo "# 📋 Analyse des fichiers source" > source_report.md
          echo "" >> source_report.md
          
          # Vérifier l'existence de GameState.kt
          if [ -f "android/app/src/main/java/com/ludomasterpro/engine/GameState.kt" ]; then
            echo "✅ GameState.kt existe" >> source_report.md
            # Vérifier les propriétés manquantes
            echo "" >> source_report.md
            echo "## Propriétés dans GameState.kt:" >> source_report.md
            echo '```' >> source_report.md
            grep -E "val (current|message|waitChoice|animating|playableIds|prizePool|competitionId|history|ranking)" \
              android/app/src/main/java/com/ludomasterpro/engine/GameState.kt 2>/dev/null || echo "⚠️ Propriétés manquantes" >> source_report.md
            echo '```' >> source_report.md
          else
            echo "❌ GameState.kt MANQUANT - À créer" >> source_report.md
          fi
          
          # Vérifier les couleurs
          echo "" >> source_report.md
          echo "## Couleurs définies:" >> source_report.md
          grep -r "val Green\|val TextDim" android/app/src/main/java/ --include="*.kt" 2>/dev/null || echo "⚠️ Green ou TextDim non définis" >> source_report.md
          
          # Vérifier les Surface avec onClick
          echo "" >> source_report.md
          echo "## Surface avec onClick (à corriger):" >> source_report.md
          grep -rn "Surface.*onClick" android/app/src/main/java/ --include="*.kt" 2>/dev/null || echo "✅ Aucune Surface avec onClick trouvée" >> source_report.md

      - name: Build APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 📊 Parse errors with file context
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "# 🔴 Rapport d'erreurs de compilation" > error_report.md
          echo "" >> error_report.md
          echo "## Résumé des erreurs par fichier" >> error_report.md
          echo "" >> error_report.md
          
          # Comptage par fichier
          grep "e: file://" android/build.log | \
            sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | \
            cut -d: -f1 | sort | uniq -c | sort -rn | \
            while read count file; do
              echo "- **$file** : $count erreur(s)" >> error_report.md
            done
          
          echo "" >> error_report.md
          echo "## Détails des erreurs" >> error_report.md
          echo "" >> error_report.md
          echo '```' >> error_report.md
          grep "e: file://" android/build.log | \
            sed 's|file:///home/runner/work/[^/]*/[^/]*/||' >> error_report.md
          echo '```' >> error_report.md
          
          echo "" >> error_report.md
          echo "## 🔧 Corrections suggérées" >> error_report.md
          echo "" >> error_report.md
          
          # Suggestions spécifiques
          if grep -q "Unresolved reference: current\|message\|waitChoice\|animating\|playableIds" android/build.log; then
            echo "### 1. Mettre à jour GameState.kt" >> error_report.md
            echo '```kotlin' >> error_report.md
            echo "data class GameState(" >> error_report.md
            echo "    val current: Player? = null," >> error_report.md
            echo "    val message: String = \"\"," >> error_report.md
            echo "    val waitChoice: Boolean = false," >> error_report.md
            echo "    val animating: Boolean = false," >> error_report.md
            echo "    val playableIds: List<String> = emptyList()," >> error_report.md
            echo "    val prizePool: Double = 0.0," >> error_report.md
            echo "    val competitionId: String = \"\"," >> error_report.md
            echo "    val history: List<GameTurn> = emptyList()," >> error_report.md
            echo "    val ranking: List<Player> = emptyList()" >> error_report.md
            echo ")" >> error_report.md
            echo '```' >> error_report.md
          fi
          
          if grep -q "Unresolved reference: Green\|TextDim" android/build.log; then
            echo "### 2. Créer les couleurs manquantes" >> error_report.md
            echo "Créer le fichier: \`android/app/src/main/java/com/ludomasterpro/ui/theme/Colors.kt\`" >> error_report.md
            echo '```kotlin' >> error_report.md
            echo "package com.ludomasterpro.ui.theme" >> error_report.md
            echo "import androidx.compose.ui.graphics.Color" >> error_report.md
            echo "val Green = Color(0xFF4CAF50)" >> error_report.md
            echo "val TextDim = Color(0xFF888888)" >> error_report.md
            echo '```' >> error_report.md
          fi
          
          if grep -q "Surface(onClick" android/build.log; then
            echo "### 3. Corriger les Surface avec onClick" >> error_report.md
            echo "Remplacer:" >> error_report.md
            echo '```kotlin' >> error_report.md
            echo "// ❌ À éviter" >> error_report.md
            echo "Surface(onClick = { }) { }" >> error_report.md
            echo "" >> error_report.md
            echo "// ✅ Correction" >> error_report.md
            echo "Surface(modifier = Modifier.clickable { }) { }" >> error_report.md
            echo '```' >> error_report.md
          fi
          
          if grep -q "animateColor" android/build.log; then
            echo "### 4. Corriger animateColor" >> error_report.md
            echo "Remplacer:" >> error_report.md
            echo '```kotlin' >> error_report.md
            echo "// ❌ À éviter" >> error_report.md
            echo "val color by animateColor(targetValue = ...)" >> error_report.md
            echo "" >> error_report.md
            echo "// ✅ Correction" >> error_report.md
            echo "import androidx.compose.animation.animateColorAsState" >> error_report.md
            echo "val color by animateColorAsState(targetValue = ...)" >> error_report.md
            echo '```' >> error_report.md
          fi
          
          if grep -q "'when' expression must be exhaustive" android/build.log; then
            echo "### 5. Corriger le 'when' non exhaustif" >> error_report.md
            echo "Ajouter tous les cas ou une branche 'else':" >> error_report.md
            echo '```kotlin' >> error_report.md
            echo "when (value) {" >> error_report.md
            echo "    PieceColor.RED -> ..." >> error_report.md
            echo "    PieceColor.GREEN -> ..." >> error_report.md
            echo "    PieceColor.BLUE -> ..." >> error_report.md
            echo "    PieceColor.YELLOW -> ..." >> error_report.md
            echo "    // ou else -> ..." >> error_report.md
            echo "}" >> error_report.md
            echo '```' >> error_report.md
          fi

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-analysis
          path: |
            android/build.log
            source_report.md
            error_report.md
          retention-days: 7

      - name: 📦 Upload APK (if success)
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCoin-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ✅ Build success notification
        if: steps.build.outputs.exit_code == '0'
        run: |
          echo "🎉 BUILD RÉUSSI !"
          echo "📱 APK disponible dans les artefacts"

      - name: ❌ Build failure notification
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "💥 BUILD ÉCHOUÉ"
          echo "📄 Consultez les artefacts pour:"
          echo "   - error_report.md (détails des erreurs)"
          echo "   - source_report.md (analyse des fichiers)"
          echo "   - build.log (logs complets)"
